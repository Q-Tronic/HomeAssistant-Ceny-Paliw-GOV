name: Walidacja integracji

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v7

      - name: Ustaw Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Zainstaluj zależności testów
        run: python -m pip install --upgrade pip aiohttp PyYAML

      - name: Sprawdź składnię Python
        run: python -m compileall -q custom_components tests scripts

      - name: Uruchom testy parsera
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Sprawdź JSON i YAML
        run: python scripts/validate_static_files.py

      - name: Sprawdź zgodność wersji
        run: python scripts/check_version_consistency.py
